[project]
name = "snake-tokscale"
version = "0.1.0"
description = "Fetch tokscale.ai contributions and generate the snake-tokscale grid.json."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Yoann Letacq" },
]
dependencies = [
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pylint>=3.2",
]

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.pylint.'MESSAGES CONTROL']
disable = ["missing-function-docstring"]

[tool.pylint.format]
max-line-length = 100
